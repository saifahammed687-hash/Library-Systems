<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Management System</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <h1 class="logo">📚 Library MS</h1>
    <nav>
      <button class="nav-btn active" data-page="dashboard">🏠 ড্যাশবোর্ড</button>
      <button class="nav-btn" data-page="books">📖 বইসমূহ</button>
      <button class="nav-btn" data-page="members">👥 সদস্যরা</button>
      <button class="nav-btn" data-page="loans">🔄 ইস্যু / রিটার্ন</button>
    </nav>
  </aside>

  <!-- Main content -->
  <main class="main">

    <!-- Dashboard -->
    <section id="page-dashboard" class="page active">
      <h2>ড্যাশবোর্ড</h2>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-value" id="stat-total-books">0</span>
          <span class="stat-label">মোট বই</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-available-books">0</span>
          <span class="stat-label">উপলব্ধ বই</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-total-members">0</span>
          <span class="stat-label">মোট সদস্য</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="stat-active-loans">0</span>
          <span class="stat-label">চলমান ইস্যু</span>
        </div>
        <div class="stat-card warn">
          <span class="stat-value" id="stat-overdue">0</span>
          <span class="stat-label">মেয়াদোত্তীর্ণ</span>
        </div>
      </div>
    </section>

    <!-- Books -->
    <section id="page-books" class="page">
      <div class="page-header">
        <h2>বইসমূহ</h2>
        <button class="btn primary" id="btn-add-book">+ নতুন বই</button>
      </div>
      <input type="text" id="book-search" placeholder="বই খুঁজুন (নাম / লেখক / ISBN / ক্যাটাগরি)..." class="search-box">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>নাম</th><th>লেখক</th><th>ISBN</th><th>ক্যাটাগরি</th>
              <th>মোট</th><th>উপলব্ধ</th><th>একশন</th>
            </tr>
          </thead>
          <tbody id="books-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Members -->
    <section id="page-members" class="page">
      <div class="page-header">
        <h2>সদস্যরা</h2>
        <button class="btn primary" id="btn-add-member">+ নতুন সদস্য</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>নাম</th><th>ইমেইল</th><th>ফোন</th><th>যোগদানের তারিখ</th><th>একশন</th></tr>
          </thead>
          <tbody id="members-tbody"></tbody>
        </table>
      </div>
    </section>

    <!-- Loans -->
    <section id="page-loans" class="page">
      <div class="page-header">
        <h2>ইস্যু / রিটার্ন</h2>
        <button class="btn primary" id="btn-issue-book">+ বই ইস্যু করুন</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>বই</th><th>সদস্য</th><th>ইস্যুর তারিখ</th><th>ফেরতের শেষ তারিখ</th><th>অবস্থা</th><th>একশন</th></tr>
          </thead>
          <tbody id="loans-tbody"></tbody>
        </table>
      </div>
    </section>

  </main>
</div>

<!-- Modal -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <h3 id="modal-title">Title</h3>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn" id="modal-cancel">বাতিল</button>
      <button class="btn primary" id="modal-confirm">সংরক্ষণ</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
